version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhms_app
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      NODE_ENV: production
    networks:
      - mariadb_mariadb_network
      - cloudflare_net

networks:
  mariadb_mariadb_network:
    external: true
  cloudflare_net:
    external: true
