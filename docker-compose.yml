version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: nhms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: amaro071318
      MYSQL_DATABASE: nhms
    volumes:
      - nhms_mysql_data:/var/lib/mysql
    networks:
      - nhms_net
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pamaro071318"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhms_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:amaro071318@mysql:3306/nhms
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nhms_net

volumes:
  nhms_mysql_data:

networks:
  nhms_net:
    driver: bridge
