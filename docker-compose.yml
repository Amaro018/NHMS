version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhms_app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    networks:
      - mariadb_network
      - cloudflare_network

networks:
  mariadb_network:
    external: true
  cloudflare_network:
    external: true
